<!DOCTYPE html>
<html>
<head>
    <title>Cache Inspector</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .section {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #6a1b9a;
        }
        pre {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            border: 1px solid #ddd;
        }
        button {
            padding: 10px 20px;
            background: #6a1b9a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff6f00;
        }
    </style>
</head>
<body>
    <h1>🔍 Cache Inspector - Debug Blog IDs</h1>
    
    <div class="section">
        <h2>Local Storage Contents</h2>
        <button onclick="inspectCache()">Inspect Cache</button>
        <button onclick="clearAllCache()">Clear All Cache</button>
        <div id="cache-output"></div>
    </div>

    <div class="section">
        <h2>Blog Card Links</h2>
        <p>Open blogs.html and check the generated links below:</p>
        <div id="links-output"></div>
    </div>

    <script>
        function inspectCache() {
            const output = document.getElementById('cache-output');
            output.innerHTML = '';
            
            // Get all localStorage items
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                
                // Only show blog-related items
                if (key.includes('blog') || key.includes('midis')) {
                    const section = document.createElement('div');
                    section.style.margin = '10px 0';
                    section.style.padding = '10px';
                    section.style.background = '#f9f9f9';
                    section.style.borderRadius = '3px';
                    
                    try {
                        const parsed = JSON.parse(value);
                        section.innerHTML = `
                            <strong>Key:</strong> ${key}<br>
                            <strong>Type:</strong> ${typeof parsed}<br>
                            <pre>${JSON.stringify(parsed, null, 2).substring(0, 300)}</pre>
                        `;
                    } catch (e) {
                        section.innerHTML = `
                            <strong>Key:</strong> ${key}<br>
                            <strong>Value:</strong> ${value.substring(0, 100)}
                        `;
                    }
                    output.appendChild(section);
                }
            }
            
            if (output.innerHTML === '') {
                output.innerHTML = '<p>❌ No blog cache found</p>';
            }
        }
        
        function clearAllCache() {
            // Get all keys to remove
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('blog') || key.includes('midis')) {
                    keysToRemove.push(key);
                }
            }
            
            // Remove them
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            alert(`✅ Cleared ${keysToRemove.length} cache items`);
            inspectCache();
        }
        
        // Auto-inspect on load
        window.addEventListener('load', inspectCache);
    </script>
</body>
</html>
