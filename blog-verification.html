<!DOCTYPE html>
<html>
<head>
    <title>Blog ID Verification Tool</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #0d0d0d;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
        }
        h1 { color: #ff6f00; margin-bottom: 20px; }
        h2 { color: #6a1b9a; margin-top: 20px; margin-bottom: 10px; }
        .log-box {
            background: #000;
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .warning { color: #ffaa00; }
        .info { color: #00aaff; }
        button {
            background: #6a1b9a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
            font-family: monospace;
        }
        button:hover {
            background: #ff6f00;
        }
        .test-result {
            background: #1a3a1a;
            border-left: 4px solid #00ff00;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .test-result.fail {
            background: #3a1a1a;
            border-left-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Blog ID Verification & Test Suite</h1>
        
        <div>
            <button onclick="testCacheStructure()">Test 1: Check Cache Structure</button>
            <button onclick="testBlogIDs()">Test 2: Verify Blog IDs</button>
            <button onclick="testURLGeneration()">Test 3: Check URL Generation</button>
            <button onclick="testAPICall()">Test 4: Simulate API Call</button>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>

        <h2>Test Output:</h2>
        <div id="logs" class="log-box"></div>
    </div>

    <script>
        const baseURL = "https://devoted-captain-c1ad6bbc4b.strapiapp.com";
        const logsDiv = document.getElementById('logs');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function clearLogs() {
            logsDiv.innerHTML = '';
        }

        function testCacheStructure() {
            log('🔍 TEST 1: Checking Cache Structure...', 'info');
            
            const cacheKey = 'midis_blogs_cache';
            const cached = localStorage.getItem(cacheKey);
            
            if (!cached) {
                log('❌ No cache found. Load blogs.html first.', 'error');
                return;
            }

            try {
                const data = JSON.parse(cached);
                log(`✅ Cache found with ${data.blogs?.length || 0} blogs`, 'success');
                
                if (data.blogs && data.blogs.length > 0) {
                    data.blogs.forEach((blog, i) => {
                        if (i < 3) { // Show first 3
                            log(`   [${i}] ID: ${blog.id}, DocID: ${blog.documentId}, Title: "${blog.Title.substring(0, 30)}..."`, 'info');
                        }
                    });
                    if (data.blogs.length > 3) {
                        log(`   ... and ${data.blogs.length - 3} more`, 'info');
                    }
                }
            } catch (e) {
                log(`❌ Cache corrupted: ${e.message}`, 'error');
            }
        }

        function testBlogIDs() {
            log('🔍 TEST 2: Verifying Blog IDs...', 'info');
            
            const cacheKey = 'midis_blogs_cache';
            const cached = localStorage.getItem(cacheKey);
            
            if (!cached) {
                log('❌ No cache found. Load blogs.html first.', 'error');
                return;
            }

            const data = JSON.parse(cached);
            const blogs = data.blogs;
            
            const uniqueDocIds = new Set(blogs.map(b => b.documentId));
            const uniqueIds = new Set(blogs.map(b => b.id));
            
            log(`✅ Total blogs: ${blogs.length}`, 'info');
            log(`✅ Unique documentIds: ${uniqueDocIds.size}`, uniqueDocIds.size === blogs.length ? 'success' : 'error');
            log(`✅ Unique numeric IDs: ${uniqueIds.size}`, uniqueIds.size === blogs.length ? 'success' : 'error');
            
            if (uniqueDocIds.size !== blogs.length) {
                log('⚠️ WARNING: Some documentIds are duplicated!', 'warning');
            }
            
            // Show ID mapping
            log('\nID Mapping:', 'info');
            blogs.forEach((blog, i) => {
                log(`   Blog ${i + 1}: documentId="${blog.documentId}" → id=${blog.id}`, 'info');
            });
        }

        function testURLGeneration() {
            log('🔍 TEST 3: Checking URL Generation...', 'info');
            
            const cacheKey = 'midis_blogs_cache';
            const cached = localStorage.getItem(cacheKey);
            
            if (!cached) {
                log('❌ No cache found. Load blogs.html first.', 'error');
                return;
            }

            const data = JSON.parse(cached);
            const blogs = data.blogs;
            
            log('Generated URLs:', 'info');
            blogs.forEach((blog, i) => {
                const blogId = blog.documentId || blog.id;
                const url = `single-blog.html?id=${blogId}`;
                log(`   Blog ${i + 1}: ${url}`, 'info');
            });

            // Check for duplicates
            const urls = blogs.map(b => `single-blog.html?id=${b.documentId || b.id}`);
            const uniqueUrls = new Set(urls);
            
            log(`\n✅ Total URLs: ${urls.length}`, 'info');
            log(`✅ Unique URLs: ${uniqueUrls.size}`, uniqueUrls.size === urls.length ? 'success' : 'error');
            
            if (uniqueUrls.size !== urls.length) {
                log('❌ PROBLEM: Duplicate URLs detected! This is the issue.', 'error');
            } else {
                log('✅ All URLs are unique - links should work!', 'success');
            }
        }

        async function testAPICall() {
            log('🔍 TEST 4: Testing API Call...', 'info');
            
            try {
                const res = await fetch(`${baseURL}/api/blogs?pagination[pageSize]=3&populate=*`);
                log(`✅ API responded with status ${res.status}`, 'success');
                
                const data = await res.json();
                const blogs = data.data;
                
                if (blogs && blogs.length > 0) {
                    log(`✅ Received ${blogs.length} blogs from API`, 'success');
                    
                    blogs.forEach((blog, i) => {
                        const blogId = blog.documentId || blog.id;
                        const url = `single-blog.html?id=${blogId}`;
                        const docIdExists = !!blog.documentId;
                        log(`   [${i}] ${docIdExists ? '✅' : '⚠️'} DocumentID exists: ${blog.documentId}`, docIdExists ? 'success' : 'warning');
                        log(`       → Will use: ${blogId}`, 'info');
                        log(`       → URL: ${url}`, 'info');
                    });
                } else {
                    log('❌ No blogs received from API', 'error');
                }
            } catch (e) {
                log(`❌ API call failed: ${e.message}`, 'error');
            }
        }

        // Run initial test on load
        window.addEventListener('load', () => {
            log('🚀 Blog Verification Tool Ready', 'success');
            log('Click buttons above to run tests', 'info');
            log('Make sure to load blogs.html first to populate cache', 'warning');
        });
    </script>
</body>
</html>
