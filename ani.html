<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walking Independence Day Boy</title>
<style>
    body {
    background: #f5f5f5;
    overflow-x: hidden;
    margin: 0;
}

.scene {
    position: relative;
    width: 100%;
    height: 300px;
}

/* Boy walking sprite */
.boy {
    position: absolute;
    bottom: 20px;
    width: 200px; /* width of one frame */
    height: 250px; /* height of frame */
    background: url('./image/60efc990-0e55-4b11-98bd-7bcce220f73f.png') left center;
    background-size: cover;
    
    animation: walkFrames 1s steps(6) infinite, moveBoy 8s linear infinite;
}

/* Walking frames */
@keyframes walkFrames {
    from { background-position: 0px; }
    to { background-position: -1200px; } /* width = frameWidth * totalFrames */
}

/* Move boy left to right */
@keyframes moveBoy {
    0% { left: -250px; }
    100% { left: 100vw; }
}

</style>
</head>
<body>

<div class="scene">
    <div class="boy"></div>
</div>

</body>
</html>
