<!DOCTYPE html>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      color: white;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Background Image with Blur */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("./image/Explore\ Our\ Work\ copy1_11zon.jpg") no-repeat center center/cover; /* 👈 apni bg image ka path daalna */
      filter: blur(8px);
      transform: scale(1.1); /* blur edges na dikhe */
      z-index: -2;
    }

    /* Dark overlay for better contrast */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 70px;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #fff;
      text-shadow: 2px 2px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(-50px);
      animation: fadeInDown 1.5s forwards;
    }

    .hero p {
      margin-top: 20px;
      font-size: 20px;
      color: #eee;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1.5s 0.5s forwards;
    }

    .hero button {
      margin-top: 40px;
      padding: 15px 40px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #ff7518;
      color: #fff;
      cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0;
      transform: scale(0.9);
      animation: fadeInUp 1.5s 1s forwards;
    }

    .hero button:hover {
      background: #ff944d;
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(255,117,24,0.6);
    }

    @keyframes fadeInDown {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Gallery */
    .gallery {
      display: grid;
     
      gap: 30px;
      padding: 80px 60px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(50px);
      opacity: 0;
      transition: all 0.6s ease;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
    }

    .card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
      border-radius: 20px;
    }

    footer {

      color: #aaa;

    @media (max-width: 768px) {

    }

  <script>
    // Scroll reveal for cards
    const cards = document.querySelectorAll('.card');
    const revealOnScroll = () => {
      const triggerBottom = window.innerHeight * 0.85;
      cards.forEach(card => {
        const cardTop = card.getBoundingClientRect().top;
        if(cardTop < triggerBottom){
          card.classList.add('show');
        }
      });
    };
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);
  </script>
