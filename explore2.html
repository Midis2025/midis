<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Reveal Cards</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .card {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      cursor: pointer;
      overflow: hidden; /* image bahar na nikle */
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* image ko screen me crop karke fit karega */
      border-radius: 0;  /* optional: agar rounded chahiye to change kar sakte ho */
    }

    .card:hover {
      transform: scale(1.05) rotateX(8deg);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }

    /* Animation effect */
    .card {
      opacity: 0.3;
      transform: scale(0.9);
    }

    .card.in-view {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="./Portfoilio (1)/1.png" alt="Work 1">
    </div>
    <div class="card">
      <img src="./Portfoilio (1)/2.png" alt="Work 2">
    </div>
    <div class="card">
      <img src="./Portfoilio (1)/3.png" alt="Work 3">
    </div>
    <div class="card">
      <img src="./Portfoilio (1)/4.png" alt="Work 4">
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll(".card");

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("in-view");
          } else {
            entry.target.classList.remove("in-view");
          }
        });
      },
      { threshold: 0.5 }
    );

    cards.forEach((card) => observer.observe(card));
  </script>
</body>
</html>
