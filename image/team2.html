<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Loop Team Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #fff;
      overflow-x: hidden;
    }

    /* Slider container */
    .slider {
      display: flex;
      width: max-content;
      animation: scroll 25s linear infinite;
    }

    .slider-wrapper {
      display: flex;
      overflow: hidden;
      width: 100%;
      padding: 50px 0;
    }

    /* Each card */
    .member {
      flex: 0 0 auto;
      width: 280px;
      margin: 0 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      text-align: center;
      padding: 20px;
      transition: transform 0.3s ease;
    }

    .member:hover {
      transform: translateY(-10px);
    }

    .member img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 12px;
    }

    .member h3 {
      margin: 15px 0 8px;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a; /* Dark heading like reference */
    }

    .member p {
      margin: 0;
      font-size: 15px;
      color: #555; /* Light gray description */
    }

    /* Infinite scroll */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .member {
        width: 220px;
        margin: 0 12px;
      }
      .member img {
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="slider-wrapper">
    <div class="slider">
      <!-- First set -->
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 1">
        <h3>John Doe</h3>
        <p>UI/UX Designer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 2">
        <h3>Jane Smith</h3>
        <p>Frontend Developer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 3">
        <h3>Michael Lee</h3>
        <p>Project Manager</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 4">
        <h3>Emily Davis</h3>
        <p>Marketing Head</p>
      </div>

      <!-- Duplicate set for infinite loop -->
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 1">
        <h3>John Doe</h3>
        <p>UI/UX Designer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 2">
        <h3>Jane Smith</h3>
        <p>Frontend Developer</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 3">
        <h3>Michael Lee</h3>
        <p>Project Manager</p>
      </div>
      <div class="member">
        <img src="https://via.placeholder.com/280x280" alt="Member 4">
        <h3>Emily Davis</h3>
        <p>Marketing Head</p>
      </div>
    </div>
  </div>
</body>
</html>
