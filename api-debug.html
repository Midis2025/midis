<!DOCTYPE html>
<html>
<head>
    <title>API Debug - Check Blog Structure</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #ddd;
        }
        .blog-info {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #6a1b9a;
        }
        h2 {
            color: #6a1b9a;
        }
    </style>
</head>
<body>
    <h1>🔍 API Debug - Blog Structure Check</h1>
    <div id="output"></div>

    <script>
        const baseURL = "https://devoted-captain-c1ad6bbc4b.strapiapp.com";
        
        async function debugAPI() {
            const output = document.getElementById('output');
            
            try {
                console.log('Fetching blogs...');
                const res = await fetch(`${baseURL}/api/blogs?pagination[pageSize]=3&populate=*`);
                const data = await res.json();
                
                output.innerHTML += '<h2>✅ API Response Received</h2>';
                output.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                if (data.data && data.data.length > 0) {
                    output.innerHTML += '<h2>📊 Individual Blog Structures:</h2>';
                    
                    data.data.forEach((blog, index) => {
                        output.innerHTML += `
                            <div class="blog-info">
                                <h3>Blog ${index + 1}</h3>
                                <p><strong>id:</strong> ${blog.id || 'undefined'}</p>
                                <p><strong>documentId:</strong> ${blog.documentId || 'undefined'}</p>
                                <p><strong>Title:</strong> ${blog.Title || 'undefined'}</p>
                                <p><strong>All keys:</strong> ${Object.keys(blog).join(', ')}</p>
                                <pre>${JSON.stringify(blog, null, 2)}</pre>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                output.innerHTML = `<pre>❌ Error: ${error.message}\n${error.stack}</pre>`;
            }
        }
        
        // Run on load
        window.addEventListener('load', debugAPI);
    </script>
</body>
</html>
