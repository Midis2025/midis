<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midis Premium Subscribe Popup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      overflow-x: hidden;
    }

    /* Overlay */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.4s ease-in-out;
      z-index: 9999;
    }

    .popup-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    /* Popup Container */
    .popup-box {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(15px);
      border-radius: 22px;
      padding: 40px 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(255, 102, 0, 0.4);
      transform: translateY(-40px) scale(0.9);
      opacity: 0;
      transition: 0.6s ease;
      border: 2px solid rgba(255, 102, 0, 0.6);
      animation: floatPopup 6s ease-in-out infinite alternate;
    }

    .popup-overlay.active .popup-box {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Floating effect */
    @keyframes floatPopup {
      from { transform: translateY(-3px) scale(0.98); }
      to { transform: translateY(3px) scale(1); }
    }

    .popup-box img {
      width: 80px;
      margin-bottom: 15px;
    }

    .popup-box h2 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
      background: linear-gradient(45deg, #ff6600, #ff3300);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .popup-box p {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .popup-box input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
      background: #1a1a1a;
      color: #fff;
      transition: 0.3s;
    }

    .popup-box input:focus {
      box-shadow: 0 0 12px #ff6600;
    }

    .popup-box button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #ff6600, #ff3300);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: 0.3s;
    }

    .popup-box button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.3);
      transform: skewX(-20deg);
      transition: 0.5s;
    }

    .popup-box button:hover::before {
      left: 100%;
    }

    .popup-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 102, 0, 0.4);
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: #fff;
      transition: 0.3s;
    }

    .close-btn:hover {
      color: #ff6600;
      transform: rotate(90deg);
    }

    /* Success Message */
    .success-msg {
      display: none;
      color: #4caf50;
      font-size: 16px;
      margin-top: 15px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

  <!-- Popup -->
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <span class="close-btn" id="closeBtn">&times;</span>
      <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Mail Icon">
      <h2>Subscribe to Midis</h2>
      <p>Get exclusive digital marketing tips, insights, and updates delivered straight to your inbox.</p>
      <input type="email" placeholder="Enter your email" id="emailInput">
      <button onclick="subscribe()">🚀 Subscribe Now</button>
      <div class="success-msg" id="successMsg">✅ Thank you for joining Midis Family!</div>
    </div>
  </div>

  <script>
    // Show popup after 5s
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("popup").classList.add("active");
      }, 5000);
    }

    // Close popup
    document.getElementById("closeBtn").onclick = function() {
      document.getElementById("popup").classList.remove("active");
    }

    // Subscribe function
    function subscribe() {
      let email = document.getElementById("emailInput").value;
      let successMsg = document.getElementById("successMsg");

      if (email && validateEmail(email)) {
        successMsg.style.display = "block";

        // 🔗 Connect to backend (Node.js, PHP, Firebase, Mailchimp API, etc.)
        console.log("Subscribed:", email);

        setTimeout(() => {
          document.getElementById("popup").classList.remove("active");
        }, 2000);
      } else {
        alert("⚠️ Please enter a valid email address.");
      }
    }

    // Email Validation
    function validateEmail(email) {
      let re = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      return re.test(email);
    }
  </script>

</body>
</html>
