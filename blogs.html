<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideas That Shape Brands | Midis Digital Blog</title>
  <link rel="icon" type="image/png" href="./image/midis m final logo-03.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.0/axios.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #fdf9ff;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(135deg, #6a1b9a, #ff6f00);
      padding: 60px 20px 30px;
      text-align: center;
      color: white;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0;
    }

    header p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      margin-top: 10px;
      max-width: 800px;
      margin-inline: auto;
    }

    .hero {
      width: 100%;
      height: 300px;
      background-image: url('https://images.unsplash.com/photo-1515378791036-0648a3ef77b2');
      background-position: center;
      background-size: cover;
      border-radius: 0 0 20px 20px;
    }

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .section h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin-bottom: 30px;
      color: #6a1b9a;
      text-align: center;
    }

    .blogs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      min-height: 200px;
    }

    .blog-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blog-card:hover {
      transform: translateY(-8px);
    }

    .blog-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .blog-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .blog-content h3 {
      color: #ff6f00;
      margin-bottom: 10px;
      font-size: clamp(1.1rem, 2vw, 1.3rem);
    }

    .blog-content p {
      color: #444;
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      margin-bottom: 15px;
      flex: 1;
    }

    .blog-content a {
      text-decoration: none;
      color: #6a1b9a;
      font-weight: 600;
      transition: color 0.3s;
      align-self: flex-start;
    }

    .blog-content a:hover {
      color: #ff6f00;
    }

    .cta {
      text-align: center;
      padding: 30px 20px;
      margin-bottom: 20px;
    }

    .cta a {
      display: inline-block;
      padding: 14px 30px;
      background: linear-gradient(to right, #6a1b9a, #ff6f00);
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .cta a:hover {
      background: linear-gradient(to right, #ff6f00, #6a1b9a);
    }

    /* Pagination Styles */
    .pagination {
      margin: 20px 0;
      text-align: center;
    }

    .pagination button {
      margin: 0 5px;
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .pagination button:hover:not(:disabled) {
      background: #f5f5f5;
      border-color: #6a1b9a;
    }

    .pagination button.active {
      background: #6a1b9a;
      color: #fff;
      border-color: #6a1b9a;
    }

    .pagination button:disabled {
      background: #eee;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error-message {
      text-align: center;
      color: #e74c3c;
      padding: 40px;
      font-size: 1.1rem;
    }

    .no-blogs {
      text-align: center;
      color: #666;
      padding: 40px;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Our Blog</h1>
    <p>Stay updated with the latest insights, strategies, and trends in digital growth.</p>
  </header>

  <div class="hero"></div>

  <section class="section">
    <h2>Latest Articles</h2>
    <div id="blogs-container" class="blogs"></div>
    <div id="pagination" class="pagination"></div>
  </section>

  <section class="cta">
    <a href="./index.html">Back to Home</a>
  </section>

  <script>
    let currentPage = 1;
    let totalPages = 1;
    const blogsPerPage = 6;
    const API_BASE = 'https://devoted-captain-c1ad6bbc4b.strapiapp.com';
    const CACHE_KEY = 'midis_blogs_cache';
    const CACHE_EXPIRY = 'midis_blogs_expiry';
    const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 days

    // Configure axios defaults for better performance
    axios.defaults.timeout = 10000;
    axios.defaults.baseURL = API_BASE;

    // ✅ Cache Management Functions
    function getCachedBlogs() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        const expiry = localStorage.getItem(CACHE_EXPIRY);
        
        if (cached && expiry) {
          const now = Date.now();
          if (now < parseInt(expiry)) {
            console.log('✅ Using cached blogs');
            return JSON.parse(cached);
          } else {
            console.log('⏰ Cache expired, clearing');
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CACHE_EXPIRY);
          }
        }
      } catch (error) {
        console.error('Error reading cache:', error);
      }
      return null;
    }

    function setCachedBlogs(blogsData) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(blogsData));
        localStorage.setItem(CACHE_EXPIRY, (Date.now() + CACHE_DURATION).toString());
        console.log('💾 Blogs cached successfully for 7 days');
      } catch (error) {
        console.error('Error saving to cache:', error);
      }
    }

    async function loadBlogs(page = 1) {
      const container = document.getElementById("blogs-container");

      try {
        // Show loading state
        container.innerHTML = '<div class="no-blogs">Loading blogs...</div>';

        let allBlogs = null;
        let pagination = null;

        // Try to use cached data first
        const cachedData = getCachedBlogs();
        if (cachedData) {
          allBlogs = cachedData.blogs;
          pagination = cachedData.pagination;
          console.log('📖 Loaded from cache');
        } else {
          // Fetch from API if no cache
          console.log('🌐 Fetching from API');
          const response = await axios.get('/api/blogs', {
            params: {
              populate: '*',
              'pagination[pageSize]': 1000, // Fetch all blogs at once to cache
              sort: 'createdAt:desc'
            }
          });

          const { data: blogs, meta } = response.data;
          allBlogs = blogs;
          pagination = meta.pagination;
          
          // Debug: Log first blog to see structure
          if (blogs.length > 0) {
            console.log('📝 First blog object structure:', JSON.stringify(blogs[0], null, 2).substring(0, 500));
            console.log('All blog IDs:', blogs.map((b, i) => `${i}: id=${b.id}, docId=${b.documentId}`).join(' | '));
          }

          // Cache the complete data
          setCachedBlogs({ blogs: allBlogs, pagination: pagination });
        }

        // Check if no blogs found
        if (!allBlogs || allBlogs.length === 0) {
          container.innerHTML = '<div class="no-blogs">No blogs found.</div>';
          return;
        }

        // Calculate pagination
        const totalBlogs = allBlogs.length;
        const totalPages = Math.ceil(totalBlogs / blogsPerPage);
        const startIndex = (page - 1) * blogsPerPage;
        const endIndex = startIndex + blogsPerPage;
        const blogsToDisplay = allBlogs.slice(startIndex, endIndex);

        // Clear container
        container.innerHTML = '';

        // Create blog cards with animation
        blogsToDisplay.forEach((blog, index) => {
          const title = blog.Title || "No Title";
          const excerpt = blog.Excerpt || 
            (blog.Content ? blog.Content.slice(0, 120) + "..." : "");

          // Optimize image URL logic
          let imageUrl = `${API_BASE}/uploads/default_blog_image.jpg`;
          
          if (blog.Image?.formats?.small?.url) {
            imageUrl = blog.Image.formats.small.url.startsWith("http") 
              ? blog.Image.formats.small.url 
              : API_BASE + blog.Image.formats.small.url;
          } else if (blog.Image?.url) {
            imageUrl = blog.Image.url.startsWith("http") 
              ? blog.Image.url 
              : API_BASE + blog.Image.url;
          }

          const card = document.createElement("div");
          card.className = "blog-card";
          card.style.animationDelay = `${index * 0.1}s`;
          
          // IMPORTANT: Use documentId as primary (Strapi v4 standard)
          // Fallback to id only if documentId doesn't exist
          const blogId = blog.documentId || blog.id;
          
          // Debug: Verify we have unique IDs
          if (!blogId) {
            console.error(`⚠️ Blog ${index} has NO ID:`, blog);
          }
          console.log(`Blog Card ${index}: documentId="${blog.documentId}", id=${blog.id}, using="${blogId}", Title="${title}"`);
          
          card.innerHTML = `
            <a href="single-blog.html?id=${blogId}">
              <img src="${imageUrl}" alt="${title}" loading="lazy" />
            </a>
            <div class="blog-content">
              <a href="single-blog.html?id=${blogId}">
                <h3>${title}</h3>
              </a>
              <p>${excerpt}</p>
              <a href="single-blog.html?id=${blogId}">
                Read More →
              </a>
            </div>`;
          container.appendChild(card);
        });

        // Update pagination with custom data
        renderPagination({ page, pageCount: totalPages, totalBlogs });

      } catch (error) {
        console.error("Error fetching blogs:", error);
        
        // Try fallback to cache even on error
        const cachedData = getCachedBlogs();
        if (cachedData) {
          console.log('⚠️ API error, showing cached data');
          const startIndex = (page - 1) * blogsPerPage;
          const endIndex = startIndex + blogsPerPage;
          const blogsToDisplay = cachedData.blogs.slice(startIndex, endIndex);
          
          container.innerHTML = '';
          blogsToDisplay.forEach((blog, index) => {
            const title = blog.Title || "No Title";
            const excerpt = blog.Excerpt || (blog.Content ? blog.Content.slice(0, 120) + "..." : "");
            let imageUrl = `${API_BASE}/uploads/default_blog_image.jpg`;
            if (blog.Image?.formats?.small?.url) {
              imageUrl = blog.Image.formats.small.url.startsWith("http") 
                ? blog.Image.formats.small.url 
                : API_BASE + blog.Image.formats.small.url;
            }
            const card = document.createElement("div");
            card.className = "blog-card";
            const blogId = blog.documentId || blog.id;
            card.innerHTML = `
              <a href="single-blog.html?id=${blogId}">
                <img src="${imageUrl}" alt="${title}" loading="lazy" />
              </a>
              <div class="blog-content">
                <a href="single-blog.html?id=${blogId}"><h3>${title}</h3></a>
                <p>${excerpt}</p>
                <a href="single-blog.html?id=${blogId}">Read More →</a>
              </div>`;
            container.appendChild(card);
          });
          const totalPages = Math.ceil(cachedData.blogs.length / blogsPerPage);
          renderPagination({ page, pageCount: totalPages });
          return;
        }
        
        let errorMessage = "Failed to load blogs. Please try again.";
        if (error.code === 'ECONNABORTED') {
          errorMessage = "Request timeout. Please check your connection.";
        } else if (error.response?.status >= 500) {
          errorMessage = "Server error. Please try again later.";
        }
        
        container.innerHTML = `<div class="error-message">⚠️ ${errorMessage}</div>`;
      }
    }

    function renderPagination(pagination) {
      const paginationContainer = document.getElementById("pagination");
      paginationContainer.innerHTML = "";

      const { page, pageCount } = pagination;
      totalPages = pageCount;

      if (pageCount <= 1) return; // Don't show pagination if only one page

      // Previous button
      const prevBtn = document.createElement("button");
      prevBtn.innerHTML = "‹ Previous";
      prevBtn.disabled = page === 1;
      prevBtn.onclick = () => {
        if (page > 1) {
          currentPage = page - 1;
          loadBlogs(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      paginationContainer.appendChild(prevBtn);

      // Page numbers with smart truncation
      const maxVisiblePages = 5;
      let startPage = Math.max(1, page - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(pageCount, startPage + maxVisiblePages - 1);

      if (endPage - startPage < maxVisiblePages - 1) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      // First page and ellipsis
      if (startPage > 1) {
        const firstBtn = document.createElement("button");
        firstBtn.innerText = "1";
        firstBtn.onclick = () => {
          currentPage = 1;
          loadBlogs(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(firstBtn);

        if (startPage > 2) {
          const ellipsis = document.createElement("span");
          ellipsis.innerText = "...";
          ellipsis.style.margin = "0 5px";
          paginationContainer.appendChild(ellipsis);
        }
      }

      // Page numbers
      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement("button");
        pageBtn.innerText = i;
        if (i === page) pageBtn.classList.add("active");
        pageBtn.onclick = () => {
          currentPage = i;
          loadBlogs(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(pageBtn);
      }

      // Last page and ellipsis
      if (endPage < pageCount) {
        if (endPage < pageCount - 1) {
          const ellipsis = document.createElement("span");
          ellipsis.innerText = "...";
          ellipsis.style.margin = "0 5px";
          paginationContainer.appendChild(ellipsis);
        }

        const lastBtn = document.createElement("button");
        lastBtn.innerText = pageCount;
        lastBtn.onclick = () => {
          currentPage = pageCount;
          loadBlogs(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(lastBtn);
      }

      // Next button
      const nextBtn = document.createElement("button");
      nextBtn.innerHTML = "Next ›";
      nextBtn.disabled = page === pageCount;
      nextBtn.onclick = () => {
        if (page < pageCount) {
          currentPage = page + 1;
          loadBlogs(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      paginationContainer.appendChild(nextBtn);
    }

    // Initialize on DOM load
    document.addEventListener("DOMContentLoaded", () => {
      loadBlogs();
    });

    // Add keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentPage > 1) {
        currentPage--;
        loadBlogs(currentPage);
      } else if (e.key === 'ArrowRight' && currentPage < totalPages) {
        currentPage++;
        loadBlogs(currentPage);
      }
    });
  </script>

</body>

</html>
