<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Midis Digital</title>
  <link rel="icon" type="image/png" href="./image/midis m final logo-03.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #fdf9ff;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(135deg, #6a1b9a, #ff6f00);
      padding: 60px 20px 30px;
      text-align: center;
      color: white;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      margin: 0;
    }

    header p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      margin-top: 10px;
      max-width: 800px;
      margin-inline: auto;
    }

    .hero {
      width: 100%;
      height: 300px;
      background-image: url('https://images.unsplash.com/photo-1515378791036-0648a3ef77b2');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 0 0 20px 20px;
    }

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .section h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin-bottom: 30px;
      color: #6a1b9a;
      text-align: center;
    }

    .blogs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .blog-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .blog-card:hover {
      transform: translateY(-8px);
    }

    .blog-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .blog-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .blog-content h3 {
      color: #ff6f00;
      margin-bottom: 10px;
      font-size: clamp(1.1rem, 2vw, 1.3rem);
    }

    .blog-content p {
      color: #444;
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      margin-bottom: 15px;
      flex: 1;
    }

    .blog-content a {
      text-decoration: none;
      color: #6a1b9a;
      font-weight: 600;
      transition: color 0.3s;
      align-self: flex-start;
    }

    .blog-content a:hover {
      color: #ff6f00;
    }

    .cta {
      text-align: center;
      padding: 30px 20px;
      margin-bottom: 20px;
    }

    .cta a {
      display: inline-block;
      padding: 14px 30px;
      background: linear-gradient(to right, #6a1b9a, #ff6f00);
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .cta a:hover {
      background: linear-gradient(to right, #ff6f00, #6a1b9a);
    }

    @media screen and (max-width: 992px) {
      .hero {
        height: 250px;
      }

      .blogs {
        gap: 20px;
      }
    }

    @media screen and (max-width: 768px) {
      header {
        padding: 40px 15px 20px;
      }

      .hero {
        height: 200px;
      }

      .blog-card img {
        height: 180px;
      }
    }

    @media screen and (max-width: 480px) {
      .hero {
        height: 160px;
      }

      .blog-card img {
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Our Blog</h1>
    <p>Stay updated with the latest insights, strategies, and trends in digital growth.</p>
  </header>

  <div class="hero"></div>

  <section class="section">
    <h2>Latest Articles</h2>
    <div id="blogs-container" class="blogs"></div>
  </section>

  <section class="cta">
    <a href="./index.html">⬅ Back to Home</a>
  </section>

  <script>
    async function loadBlogs() {
      try {
        const res = await fetch("https://devoted-captain-c1ad6bbc4b.strapiapp.com/api/blogs");
        const data = await res.json();
        const blogs = data.data;

        const container = document.getElementById("blogs-container");
        container.innerHTML = "";

        blogs.forEach(blog => {
          const imageUrl =
            blog.image?.formats?.medium?.url ||
            blog.image?.url ||
            "https://via.placeholder.com/600x400";

          const card = document.createElement("div");
          card.className = "blog-card";

          card.innerHTML = `
            <img src="${imageUrl}" alt="${blog.title}" />
            <div class="blog-content">
              <h3>${blog.title}</h3>
              <p>${blog.excerpt || blog.content?.slice(0, 100) + "..."}</p>
              <a href="single-blog.html?id=${blog.id}">Read More →</a>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error fetching blogs:", err);
      }
    }

    loadBlogs();
  </script>
</body>
</html>
